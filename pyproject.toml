[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-linux-check"
version = "1.0.0"
description = "Steam Linux compatibility checker"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.1",
]

[project.scripts]
steam-linux-check = "steam_linux_check.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]