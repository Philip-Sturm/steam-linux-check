[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-linux-check"
version = "0.1.0"
description = "Steam Linux compatibility checker"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]